[pytest]
# scripts/ contains manual/CLI smoke-test scripts (e.g. model_smoke_test.py)
# that talk to a live Ollama server; they are not automated tests and must
# not be auto-collected by `pytest`. Layer-local tests live with each layer
# (layers/*/tests, capabilities/tests); cross-layer/integration/system tests
# live under testing/ (see docs/architecture/SPS_CA_ARCHITECTURE_V2.md, Sec 9).
testpaths =
    layers
    capabilities
    core
    testing
norecursedirs = .git scripts sandbox data memory projects experience evaluation analytics docs
python_files = test_*.py
