name: Target Projects

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-project:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project_a_python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Run stable contract tests
        run: python -m pytest -q -k "not seeded_exists_defect_is_present"
      - name: Run seeded self-programming benchmark
        continue-on-error: true
        run: python -m pytest -q -k "seeded_exists_defect_is_present"

  java-project:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project_b_java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn -q test

  typescript-project:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project_c_typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: projects/project_c_typescript/package.json}
      - run: npm install
      - name: Run stable contract tests
        run: npm test -- --exclude test/app.test.ts
      - name: Run seeded self-programming benchmark
        continue-on-error: true
        run: npx vitest run test/app.test.ts
      - run: npm run build
