name: Phase 9 Baselines

on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r layers/layer_02_cognitive_core/requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest -q baselines/tests
