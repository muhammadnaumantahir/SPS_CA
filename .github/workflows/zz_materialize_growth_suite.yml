name: Materialize Growth Suite

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate canonical 1000 scenarios
        run: |
          python scripts/generate_growth_scenarios.py
          mv evaluation/scenarios/growth_1000.json evaluation/scenarios/growth.json
      - name: Commit growth.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/scenarios/growth.json
          if git diff --cached --quiet; then
            echo 'growth.json already current'
          else
            git commit -m 'test: add canonical 1000-scenario growth suite'
            git push
          fi
