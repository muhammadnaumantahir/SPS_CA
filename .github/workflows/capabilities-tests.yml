name: Seed Capabilities

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seed-capabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -U -r requirements.txt
      - name: Run legacy compatibility capability tests
        run: python -m pytest capabilities/tests/test_seed_capabilities.py -q
      - name: Run canonical capability tests
        run: python -m pytest core/tests/test_canonical_capabilities.py core/tests/test_canonical_registry.py -q
      - name: Run Brain routing tests
        run: python -m pytest brain/tests/test_brain.py brain/tests/test_capability_planning.py -q
