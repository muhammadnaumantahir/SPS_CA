name: Seed Capabilities

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seed-capabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install -U pytest
      - name: Run seed capability tests
        run: python -m pytest capabilities/tests/test_seed_capabilities.py -q
