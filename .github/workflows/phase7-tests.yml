name: Phase 7 CLI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Phase 7 CLI tests
        run: python -m pytest ui/tests/test_cli_interface.py -q
      - name: Verify direct CLI entrypoint
        run: printf 'help\nquit\n' | python ui/cli_interface.py
